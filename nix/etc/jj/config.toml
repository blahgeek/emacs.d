"$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"

[user]
name = "Yikai Zhao"
email = "yikai@z1k.dev"

[ui]
default-command = ["log-as-default-command"]
diff-editor = "@@@/jj-magit-diff-editor"
diff-formatter = ":git"
conflict-marker-style = "git"

# log-word-wrap = true:::
# ◆  uxwznyks yikai@z1k.dev 2026-05-26 11:38:10 ec783c6b
# │  Revert "Update pi.bash to use Anthropic provider and Claude Opus 4.7 model
# │  instead of kh-stealth OpenAI and GPT-5.5"
#
# default:::
# ◆  uxwznyks yikai@z1k.dev 2026-05-26 11:38:10 ec783c6b
# │  Revert "Update pi.bash to use Anthropic provider and Claude Opus 4.7 model ins
# tead of kh-stealth OpenAI and GPT-5.5"
#
log-word-wrap = true

[templates]
git_push_bookmark = '''
"z1k/" ++
  description
    .first_line()
    .lower()
    .replace(regex:"[^a-z0-9]+", "-")
    .remove_prefix("draft-")
    .substr(0, 42)
    .remove_suffix("-") ++
  "+jj-" ++ change_id.short()
'''
draft_commit_description = '''
concat(
  builtin_draft_commit_description,
  "\nJJ: ignore-rest\n",
  diff.git(),
)
'''
new_description = '''
if(parents.len() > 1,
  "Merge " ++ parents.skip(1).map(|p| try(
    p.bookmarks().first().name(),
    p.change_id().shortest(8)
  )).join(", ") ++ " into " ++ try(
    parents.first().bookmarks().first().name(),
    parents.first().change_id().shortest(8)
  ) ++ "\n",
  ""
)
'''

[template-aliases]
"format_timestamp(timestamp)" = '''
  timestamp.local().format("%Y-%m-%d %H:%M, ") ++ timestamp.ago()
'''

[git]
# private-commits = "description(glob:'debug:*') | description(glob:'private:*') | description(glob:'tmp:*')"
private-commits = "description(glob:'private:*')"
colocate = true
fetch = "*"  # fetch from all remotes by default

[revsets]
bookmark-advance-to = "@-"

[aliases]
# show first screen and exit
# - why not using "| head -n $(tput lines)"? because it does not work well with long lines (kept lines may need more lines to display)
# "+G +g +q" is required instead of "+q", to display the content before quit.
log-as-default-command = ["util", "exec", "--", "bash", "-c", "jj --no-pager --color=always log --limit=30 | less -F -R --no-init +G +g +q"]
e = ["edit"]
init = ["git", "init", "--colocate"]
push = ["git", "push"]
remote = ["git", "remote"]
fetch = ["git", "fetch"]
tug = ["bookmark", "advance"]

pre-commit = ["util", "exec", "--", "bash", "-c", '''
jj diff -r ${1:-@} --name-only --no-pager | xargs pre-commit run --files
''', "argv0"]

push-mr = ["util", "exec", "--", "@@@/jj-push-mr"]

# push-tmp = "push -c" && "bookmark delete"
push-tmp = ["util", "exec", "--", "@@@/jj-push-tmp"]

# similar to "jj new" but allow from unreachable commit
newx = ["util", "exec", "--", "bash", "-c", '''
set -ex

COMMIT=$1
TMPBRANCH="tmp-$(date +%s)"

git branch $TMPBRANCH $COMMIT
jj new $TMPBRANCH
jj bookmark delete $TMPBRANCH
''', "argv0"]

# TODO: cannot handle line ending with "conflict"
abandon-interactive = ["util", "exec", "--", "bash", "-c", '''
jj --color=always log | \
fzf --ansi --no-sort --reverse \
--no-input \
--preview '[[ {} == *○* ]] && jj show {-1}' \
--header 'a: abandon REV; A: abandon REV::' \
--bind 'a:execute([[ {} == *○* ]] && jj abandon {-1})+reload(jj --color=always log)' \
--bind 'A:execute([[ {} == *○* ]] && jj abandon {-1}::)+reload(jj --color=always log)' \
--bind j:down,k:up,G:last,g:first,q:abort
''', "argv0"]
